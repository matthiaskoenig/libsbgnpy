[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libsbgnpy"
dynamic = ["version"]
description = "libsbgnpy are python utilities for working with SBGN."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
maintainers = [
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Science/Research",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: Implementation :: CPython",
	"Topic :: Scientific/Engineering",
	"Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
	"modeling",
	"standardization",
	"COMBINE",
	"SBGN",
	"visualization",
]
dependencies = [
	"lxml>=6.1.3",
	"requests>=2.34.2",
	"rich>=15.0.0",
	"xsdata>=26.2",
]

[project.optional-dependencies]
dev = [
    "bump-my-version>=1.5.1",
    "ruff>=0.16.6",
    "pre-commit>=4.6.2",
    "ty>=0.0.78",
    "tox>=4.61.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "zensical>=0.0.59",
    "mkdocstrings-python>=2.0.8",
    "lxml-stubs>=0.5.1",
]

[project.urls]
Homepage = "https://matthiaskoenig.github.io/libsbgnpy"
Documentation = "https://matthiaskoenig.github.io/libsbgnpy"
Repository = "https://github.com/matthiaskoenig/libsbgnpy"
Issues = "https://github.com/matthiaskoenig/libsbgnpy/issues"
Changelog = "https://github.com/matthiaskoenig/libsbgnpy/tree/develop/release-notes"
Download = "https://pypi.org/project/libsbgnpy"

[tool.hatch.version]
path = "./src/libsbgnpy/__init__.py"

[tool.hatch.build]
# work in progress, see `libsbgnpy.oven`; not shipped
exclude = [
    "src/libsbgnpy/oven",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
# first-party modules live in the src layout; the checked python version is
# inferred from `project.requires-python` (i.e. the oldest supported version)
root = ["./src"]

[tool.ty.src]
include = ["src", "tests", "examples"]

[tool.ty.terminal]
# warnings are failures: keep the codebase free of any diagnostic
error-on-warning = true
