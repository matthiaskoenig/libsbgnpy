[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libsbgnpy"
dynamic = ["version"]
description = "libsbgnpy are python utilities for working with SBGN."
readme = "README.md"
requires-python = ">=3.10"
authors = [
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
maintainers = [
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Science/Research",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: Implementation :: CPython",
	"Topic :: Scientific/Engineering",
	"Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
	"modeling",
	"standardization",
	"COMBINE",
	"SBGN",
]
dependencies = [
    "requests>=2.32.5",
	"lxml>=6.0.2",
	"xsdata>=26.1",
	"rich>=14.3.2",
    "urllib3>=2.6.3"
]

[project.optional-dependencies]
dev = [
    "bump-my-version>=1.2.6",
	"ruff>=0.14.14",
	"pre-commit>=4.5.1",
	"mypy>=1.19.1",
	"pytest>=9.0.2",
]
docs = [
	"mkdocs",
	"mkdocstrings-python",
	"mkdocs-material",
	"mkdocs-jupyter",
	"ipython",
]
test = [
    "tox>=4.14.2",
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
]

[project_urls]
Homepage = "https://github.com/matthiaskoenig/libsbgnpy"
Repository = "https://github.com/matthiaskoenig/libsbgnpy"
Documentation = "https://github.com/matthiaskoenig/libsbgnpy"
Issues = "https://github.com/matthiaskoenig/libsbgnpy/issues"
Download = "https://pypi.org/project/libsbgnpy"

[tool.hatch.version]
path = "./src/libsbgnpy/__init__.py"
