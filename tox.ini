[tox]
envlist = ty, py3.{11,12,13,14,15}

[testenv]
package = wheel
wheel_build_env = .pkg
deps =
    pytest
    # tests/test_bindings.py regenerates the bindings
    xsdata[cli]
    ruff
commands =
    pytest

[testenv:ty]
passenv =
    TY_OUTPUT_FORMAT
deps =
    ty
    pytest
    lxml-stubs
commands =
    ty check
