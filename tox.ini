[tox]
envlist = ty, py3.{11,12,13,14,15}

[testenv]
package = wheel
wheel_build_env = .pkg
deps =
    pytest
    # `-n auto` of continuous integration, see .github/workflows/ci-cd.yml
    pytest-xdist
    # tests/test_bindings.py regenerates the bindings
    xsdata[cli]
    ruff
commands =
    pytest {posargs}

[testenv:ty]
# the versions of ty and the stubs come from uv.lock (the dev extra), so the
# check only changes with a dependency update, not with a new release of ty
runner = uv-venv-lock-runner
extras =
    dev
passenv =
    TY_OUTPUT_FORMAT
commands =
    ty check
