# Keep the GitHub Actions used in the workflows and the python dependencies up to date,
# monthly, since every update pull request runs the checks.
# See https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # a single pull request for all action updates instead of one per action
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    # a single pull request for all dependency updates instead of one per package
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
